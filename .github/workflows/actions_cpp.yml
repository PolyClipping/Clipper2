name: C++
on:
  push:
  pull_request:
jobs:
  windows-latest:
    runs-on: 'windows-latest'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '16'
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2
    - name: Build
      run: |
        mkdir CPP/build
        cd CPP/build
        cmake .. -DCLIPPER2_TESTS=ON -DCLIPPER2_UTILS:BOOL=ON -DCLIPPER2_EXAMPLES:BOOL=ON
        cmake --build . --config RelWithDebInfo --parallel
    - name: Run tests
      run: |
        cd CPP/build
        ctest . -C RelWithDebInfo --output-on-failure
  windows-11-arm:
    runs-on: 'windows-11-arm'
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: |
        mkdir CPP/build
        cd CPP/build
        cmake .. -A ARM64 -DCLIPPER2_TESTS=ON -DCLIPPER2_UTILS:BOOL=ON -DCLIPPER2_EXAMPLES:BOOL=ON
        cmake --build . --config RelWithDebInfo --parallel
    - name: Run tests
      run: |
        cd CPP/build
        ctest . -C RelWithDebInfo --output-on-failure
  windows-dll:
    name: windows-dll-${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Each platform builds on the runner image that has the v143 toolset for it.
        include:
        - { platform: x86, runner: windows-latest, msbuild: x64, outdir: '', suffix: '32', machine: '0x14C' }
        - { platform: x64, runner: windows-latest, msbuild: x64, outdir: 'x64\', suffix: '64', machine: '0x8664' }
        - { platform: ARM64, runner: windows-11-arm, msbuild: arm64, outdir: 'ARM64\', suffix: 'arm64', machine: '0xAA64' }
    steps:
    - uses: actions/checkout@v4
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2
      with:
        msbuild-architecture: ${{ matrix.msbuild }}
    - name: Build
      working-directory: DLL/CPP_DLL
      run: |
        foreach ($config in 'Debug', 'Release') {
          foreach ($solution in 'Clipper2_DLL.sln', 'Clipper2_Z_DLL.sln') {
            msbuild $solution -m -nologo "-p:Configuration=$config" "-p:Platform=${{ matrix.platform }}"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
        }
    - name: Check DLL names and machine types
      working-directory: DLL/CPP_DLL
      run: |
        foreach ($config in 'Debug', 'Release') {
          foreach ($name in 'Clipper2', 'Clipper2_Z') {
            $dll = "${{ matrix.outdir }}$config\${name}_${{ matrix.suffix }}.dll"
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path $dll))
            $machine = [BitConverter]::ToUInt16($bytes, [BitConverter]::ToInt32($bytes, 0x3C) + 4)
            if ($machine -ne ${{ matrix.machine }}) { throw "$dll has machine type 0x$($machine.ToString('X'))" }
            Write-Output "$dll OK"
          }
        }
  ubuntu-latest-gcc-default:
    runs-on: 'ubuntu-latest'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '16'
    - name: Build
      run: |
        mkdir CPP/build
        cd CPP/build
        cmake .. -DCLIPPER2_TESTS=ON
        make
    - name: Run tests
      run: |
        cd CPP/build
        env CTEST_OUTPUT_ON_FAILURE=1 make test
  ubuntu-latest-gcc-hi-precision:
    runs-on: 'ubuntu-latest'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '16'
    - name: Build
      run: |
        mkdir CPP/build
        cd CPP/build
        cmake .. -DCLIPPER2_TESTS=ON -DCLIPPER2_HI_PRECISION=ON
        make
    - name: Run tests
      run: |
        cd CPP/build
        env CTEST_OUTPUT_ON_FAILURE=1 make test
  ubuntu-24.04-gcc-11:
    runs-on: 'ubuntu-24.04'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '16'
    - name: Install gcc 11
      run: |
        sudo apt update
        sudo apt install gcc-11 g++-11
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 110 --slave /usr/bin/g++ g++ /usr/bin/g++-11 --slave /usr/bin/gcov gcov /usr/bin/gcov-11
    - name: Build
      run: |
        mkdir CPP/build
        cd CPP/build
        cmake .. -DCLIPPER2_TESTS=ON
        make
    - name: Run tests
      run: |
        cd CPP/build
        env CTEST_OUTPUT_ON_FAILURE=1 make test
  ubuntu-latest-clang-default:
    runs-on: 'ubuntu-latest'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '16'
    - name: Build
      run: |
        export CC=/usr/bin/clang
        export CXX=/usr/bin/clang++
        mkdir CPP/build
        cd CPP/build
        cmake .. -DCLIPPER2_TESTS=ON
        make
    - name: Run tests
      run: |
        cd CPP/build
        env CTEST_OUTPUT_ON_FAILURE=1 make test
  ubuntu-24.04-clang-17:
    runs-on: 'ubuntu-24.04'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '16'
    - name: Install clang 17
      run: |
        sudo apt update
        sudo apt install clang-17
    - name: Build
      run: |
        export CC=/usr/bin/clang-17
        export CXX=/usr/bin/clang++-17
        mkdir CPP/build
        cd CPP/build
        cmake .. -DCLIPPER2_TESTS=ON
        make
    - name: Run tests
      run: |
        cd CPP/build
        env CTEST_OUTPUT_ON_FAILURE=1 make test
  macos-latest:
    runs-on: 'macos-latest'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '16'
    - name: Build
      run: |
        mkdir CPP/build
        cd CPP/build
        cmake .. -DCLIPPER2_TESTS=ON
        make
    - name: Run tests
      run: |
        cd CPP/build
        env CTEST_OUTPUT_ON_FAILURE=1 make test
